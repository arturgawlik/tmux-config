# Previous config: tmux.conf.before-sessionx
# Plugins are installed with <prefix> I (TPM).

# ── General ────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
# closing the last tab of a workspace jumps to another workspace instead of detaching
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "#S · #W"

# ── Terminal / Neovim ──────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
# undercurl + coloured underlines (LSP diagnostics)
set -as terminal-features ",*:usstyle"
set -s escape-time 0
set -g focus-events on           # autoread / gitsigns refresh on focus
set -g set-clipboard on          # OSC 52 yank from nvim
set -g allow-passthrough on      # image.nvim, kitty graphics
set -s extended-keys on          # Ctrl-' and friends reach nvim
set -g extended-keys on
set -g extended-keys-format csi-u

# ── Look (catppuccin) ──────────────────────
# Follows the terminal's light/dark theme: Latte / Mocha. theme.sh applies the
# flavour; it runs at the end of this file and whenever the terminal switches.
set -g status-position top
set-hook -g client-dark-theme  'run-shell -b "bash ~/.config/tmux/theme.sh mocha"'
set-hook -g client-light-theme 'run-shell -b "bash ~/.config/tmux/theme.sh latte"'

# ── Keys ───────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind S command-prompt -p "new workspace:" "new-session -s '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection

# Pane navigation shared with nvim splits (smart-splits.nvim sets @pane-is-vim)
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
# resizing matches AstroNvim's smart-splits C-arrow maps
bind -n C-Left  if -F "#{@pane-is-vim}" "send-keys C-Left"  "resize-pane -L 3"
bind -n C-Down  if -F "#{@pane-is-vim}" "send-keys C-Down"  "resize-pane -D 3"
bind -n C-Up    if -F "#{@pane-is-vim}" "send-keys C-Up"    "resize-pane -U 3"
bind -n C-Right if -F "#{@pane-is-vim}" "send-keys C-Right" "resize-pane -R 3"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# the keys above are taken from the shell; get them back behind the prefix
bind C-l send-keys C-l
bind C-p send-keys C-p

# ── Fullscreen (Ctrl-Alt-f, like the zellij setup) ──
# Zooms the pane and hides the status bar. The mode is global: every tab and
# workspace you switch to (picker included) is zoomed too, until you toggle off.
bind -n C-M-f if -F "#{@fullscreen}" \
  "set -gu @fullscreen ; set -g status on ; if -F '#{window_zoomed_flag}' 'resize-pane -Z'" \
  "set -g @fullscreen 1 ; set -g status off ; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'"
set-hook -g session-window-changed \
  "if -F '#{@fullscreen}' \"if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'\""
set-hook -g client-session-changed \
  "if -F '#{@fullscreen}' \"if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'\""

# ── Picker: workspaces (sessions) + tabs (windows) ──
# (its colours are set per flavour by theme.sh)
set -g @sessionx-bind "C-p"
set -g @sessionx-prefix "off"
set -g @sessionx-fzf-builtin-tmux "on"
set -g @sessionx-window-mode "on"
set -g @sessionx-filter-current "false"
set -g @sessionx-x-path "~/git"

# ── Autosave / restore workspaces ──────────
set -g @resurrect-capture-pane-contents "on"
# restart nvim bare so AstroNvim restores its own directory session
set -g @resurrect-processes '"~nvim->nvim"'
set -g @continuum-restore "on"
set -g @continuum-save-interval "10"

# ── Plugins ────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "omerxx/tmux-sessionx"

# Catppuccin status modules. #{E:} expands at draw time, so this can come
# before the theme loads. The continuum_save call is continuum's autosave
# trigger: continuum only adds it itself on a fresh server start, not on
# `prefix r`, so it is written out here to survive reloads.
set -g status-left ""
set -g status-right "#(/home/ag/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"

# TPM re-runs catppuccin and sessionx with their defaults, so theme.sh must not
# skip the flavour below as already applied.
set -gu @theme-applied

run "~/.config/tmux/plugins/tpm/tpm"

# After TPM, which runs catppuccin and sessionx with their defaults. Uses the
# current client's theme on `prefix r`; at server start there is no client yet,
# so it starts on Mocha and the theme hook switches as soon as a client attaches.
run-shell "bash ~/.config/tmux/theme.sh #{?#{==:#{client_theme},light},latte,mocha}"
